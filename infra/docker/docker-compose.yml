name: opsowl

# Load secrets from root .env — never hardcode credentials here
# Copy .env.example → .env and fill in before running

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: opsowl-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object Storage ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: opsowl-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # SSE (Server-Side Encryption) — AES-256-GCM for all objects at rest.
      # Format: <key-name>:<base64-encoded-32-byte-key>
      # Generate: openssl rand -base64 32
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-opsowl-default-key:bXlzZWNyZXRrZXkxMjM0NTY3ODkwMTIzNDU2}
      MINIO_KMS_KES_ENDPOINT: ""
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Go API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: opsowl-api
    restart: unless-stopped
    ports:
      - "8080:8080"   # direct access for dev/debugging; nginx is primary in prod
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: opsowl
      STORAGE_USE_SSL: "false"
      AI_SERVICE_URL: http://ai-service:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_ATTR: ${LDAP_USER_ATTR:-sAMAccountName}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      # AES-256 column-level encryption key (base64-encoded 32 bytes).
      # Generate: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # SIEM / audit forwarding
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_FORMAT: ${SIEM_FORMAT:-json}
      # SMTP for email notifications
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@opsowl.local}
      SMTP_TLS: ${SMTP_TLS:-true}
      # Password policy
      PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_NUMBER: ${PASSWORD_REQUIRE_NUMBER:-true}
      # Session limits
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      # Workspace terminology — each client sets these in their .env
      INDUSTRY: ${INDUSTRY:-financial_services}
      CASE_LABEL: ${CASE_LABEL:-Case}
      CASES_LABEL: ${CASES_LABEL:-Cases}
      TASK_LABEL: ${TASK_LABEL:-Task}
      TASKS_LABEL: ${TASKS_LABEL:-Tasks}
      DOCUMENT_LABEL: ${DOCUMENT_LABEL:-Document}
      DOCUMENTS_LABEL: ${DOCUMENTS_LABEL:-Documents}
      RISK_SCORE_LABEL: ${RISK_SCORE_LABEL:-Risk Score}
      RISK_LEVEL_LABEL: ${RISK_LEVEL_LABEL:-Risk Level}
      SLA_LABEL: ${SLA_LABEL:-SLA}
      COMMS_LABEL: ${COMMS_LABEL:-Communications}
      ANALYST_LABEL: ${ANALYST_LABEL:-Analyst}
      TIMELINE_LABEL: ${TIMELINE_LABEL:-Timeline}
      NOTE_LABEL: ${NOTE_LABEL:-Note}
      NOTES_LABEL: ${NOTES_LABEL:-Notes}
    volumes:
      - ../../apps/api/keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Python AI Service ────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    container_name: opsowl-ai
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GO_API_URL: http://api:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: opsowl-web
    restart: unless-stopped
    ports:
      - "3001:3000"   # direct access for dev/debugging; nginx is primary in prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Nginx (TLS termination + reverse proxy) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: opsowl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: opsowl-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    container_name: opsowl-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-opsowl-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
