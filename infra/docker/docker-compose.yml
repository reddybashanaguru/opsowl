name: opsowl

# Load secrets from root .env — never hardcode credentials here
# Copy .env.example → .env and fill in before running

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: opsowl-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # WAL archiving for point-in-time recovery (P1-5).
    # archive_command copies each completed WAL segment into the wal_archive volume.
    # archive_timeout=300 forces a segment flush every 5 minutes so the maximum
    # data loss window is bounded (instead of waiting for a full 16MB segment).
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal-archive/%f && echo "archived %f"'
      -c archive_timeout=300
      -c max_wal_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Object Storage ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: opsowl-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
      MINIO_KMS_KES_ENDPOINT: ""
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Go API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: opsowl-api
    restart: unless-stopped
    # 35s gives the 30s shutdown context room to drain audit chain + document
    # processing goroutines before Docker sends SIGKILL.
    stop_grace_period: 35s
    ports:
      # Bind only to loopback — all external traffic must flow through nginx.
      # This prevents IP-spoofing attacks via forged X-Real-IP / X-Forwarded-For
      # headers sent directly to the Go API port, bypassing the rate limiter.
      - "127.0.0.1:8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
      STORAGE_ENDPOINT: opsowl-minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-localhost:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-opsowl-docs}
      STORAGE_USE_SSL: "false"
      AI_SERVICE_URL: http://opsowl-ai:8000
      # Shared secret for Go→Python inter-service authentication (P0-2).
      # Generate: openssl rand -hex 32
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_ATTR: ${LDAP_USER_ATTR:-sAMAccountName}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_FORMAT: ${SIEM_FORMAT:-json}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@opsowl.local}
      SMTP_TLS: ${SMTP_TLS:-true}
      PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-5}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-true}
      PASSWORD_REQUIRE_NUMBER: ${PASSWORD_REQUIRE_NUMBER:-true}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-clamav:3310}
      MAX_REQUESTS_PER_MIN: ${MAX_REQUESTS_PER_MIN:-100}
      INDUSTRY: ${INDUSTRY:-financial_services}
      CASE_LABEL: ${CASE_LABEL:-Case}
      CASES_LABEL: ${CASES_LABEL:-Cases}
      TASK_LABEL: ${TASK_LABEL:-Task}
      TASKS_LABEL: ${TASKS_LABEL:-Tasks}
      DOCUMENT_LABEL: ${DOCUMENT_LABEL:-Document}
      DOCUMENTS_LABEL: ${DOCUMENTS_LABEL:-Documents}
      RISK_SCORE_LABEL: ${RISK_SCORE_LABEL:-Risk Score}
      RISK_LEVEL_LABEL: ${RISK_LEVEL_LABEL:-Risk Level}
      SLA_LABEL: ${SLA_LABEL:-SLA}
      COMMS_LABEL: ${COMMS_LABEL:-Communications}
      ANALYST_LABEL: ${ANALYST_LABEL:-Analyst}
      TIMELINE_LABEL: ${TIMELINE_LABEL:-Timeline}
      NOTE_LABEL: ${NOTE_LABEL:-Note}
      NOTES_LABEL: ${NOTES_LABEL:-Notes}
    volumes:
      - ../../apps/api/keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Ollama (local LLM inference — air-gapped on-premise) ────────────────────
  # Default provider for all AI features. No data leaves the network.
  # Models: llama3.1:8b (LLM) + nomic-embed-text (768-dim embeddings).
  # Hardware: 8 GB RAM minimum; Apple Silicon / NVIDIA GPU accelerated automatically.
  ollama:
    image: ollama/ollama:latest
    container_name: opsowl-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/11434' 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

  # ── Ollama model initializer (runs once; models cached in ollama_data volume) ─
  # Pulls llama3.1:8b and nomic-embed-text on first boot. Subsequent starts skip
  # the download because the volume already contains the model files.
  ollama-init:
    image: curlimages/curl:latest
    container_name: opsowl-ollama-init
    restart: "no"
    entrypoint: >
      sh -c "
        echo '[ollama-init] waiting for Ollama to start...';
        until curl -sf http://ollama:11434/api/version; do sleep 3; done;
        echo '[ollama-init] pulling ${OLLAMA_MODEL:-llama3.1:8b}...';
        curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\":\"${OLLAMA_MODEL:-llama3.1:8b}\"}' | tail -1;
        echo '[ollama-init] pulling ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}...';
        curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\":\"${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}\"}' | tail -1;
        echo '[ollama-init] models ready.';
      "
    depends_on:
      ollama:
        condition: service_started

  # ── Python AI Service ────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    container_name: opsowl-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GO_API_URL: http://api:8080
      # Must match the Go API's AI_SERVICE_SECRET (P0-2).
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET}
      # ── LLM provider — set to 'ollama' for air-gapped on-premise (default) ──
      # Set to 'anthropic' or 'openai' only if the Cloud AI add-on is purchased.
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Cloud AI credentials — leave empty for air-gapped deployments.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Object storage — must match the api service storage config.
      STORAGE_ENDPOINT: opsowl-minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-opsowl-docs}
      STORAGE_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: opsowl-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Nginx (TLS termination + reverse proxy) ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: opsowl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: opsowl-prometheus
    restart: unless-stopped
    ports:
      # Localhost-only: exposes operational metrics — restrict to internal access.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      api:
        condition: service_healthy

  # ── Alertmanager (P1-6) ──────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: opsowl-alertmanager
    restart: unless-stopped
    ports:
      # Localhost-only: alert routing config contains SMTP credentials.
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    environment:
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alerts@opsowl.local}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-ops@opsowl.local}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ── ClamAV Antivirus ─────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4
    container_name: opsowl-clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_MaxFileSize: "52428800"
      CLAMD_CONF_StreamMaxLength: "52428800"
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── PostgreSQL backup sidecar (P0-4 + P1-5) ─────────────────────────────────
  # Daily logical dump (pg_dump) + optional S3 offsite sync via rclone.
  # WAL archiving handles continuous recovery; pg_dump is the weekly safety net.
  #
  # S3 offsite sync: set BACKUP_S3_BUCKET, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  # AWS_DEFAULT_REGION in .env. Leave BACKUP_S3_BUCKET empty to skip S3 upload.
  #
  # Restore a logical dump:
  #   gunzip -c /backups/opsowl-YYYYMMDD-HHMMSS.sql.gz | \
  #     psql -h localhost -p 5433 -U $POSTGRES_USER $POSTGRES_DB
  #
  # PITR from WAL archive (if archive is intact):
  #   1. Stop postgres; restore a base backup; configure recovery.conf pointing at wal_archive.
  #   2. Set recovery_target_time to the desired point in time.
  pg-backup:
    image: alpine:3.20
    container_name: opsowl-pg-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # S3 offsite — all optional; leave BACKUP_S3_BUCKET empty to skip upload.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    volumes:
      - pg_backups:/backups
    entrypoint: >
      sh -c "
        apk add --no-cache postgresql17-client curl > /dev/null 2>&1;
        if [ -n \"$$BACKUP_S3_BUCKET\" ]; then
          echo '[pg-backup] installing rclone for S3 sync...';
          curl -sfL https://rclone.org/install.sh | sh > /dev/null 2>&1;
        fi;
        while true; do
          FNAME=/backups/opsowl-$$(date +%Y%m%d-%H%M%S).sql.gz;
          pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB | gzip > $$FNAME;
          echo \"[pg-backup] wrote $$FNAME\";
          find /backups -name '*.sql.gz' -mtime +7 -delete;
          if [ -n \"$$BACKUP_S3_BUCKET\" ]; then
            rclone copy --s3-provider AWS --s3-region $$AWS_DEFAULT_REGION \
              /backups s3://$$BACKUP_S3_BUCKET/opsowl-backups/ \
              && echo \"[pg-backup] synced to s3://$$BACKUP_S3_BUCKET\" \
              || echo \"[pg-backup] WARNING: S3 sync failed\";
          fi;
          sleep 86400;
        done
      "
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6.0
    container_name: opsowl-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  wal_archive:
  minio_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  pg_backups:
  ollama_data:
