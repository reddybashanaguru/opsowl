global:
  resolve_timeout: 5m
  # SMTP settings — override with env vars passed through docker-compose
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ops-email

  routes:
    - match:
        severity: critical
      receiver: ops-email
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: ops-email
      repeat_interval: 4h

receivers:
  - name: ops-email
    email_configs:
      - to: "${ALERT_EMAIL}"
        send_resolved: true
        headers:
          Subject: "[OpsOwl {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"

  # Webhook receiver — uncomment and set ALERT_WEBHOOK_URL to forward to Slack/Teams/PagerDuty
  # - name: webhook
  #   webhook_configs:
  #     - url: "${ALERT_WEBHOOK_URL}"
  #       send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
