name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go Backend ──────────────────────────────────────────────────────────────
  go-test:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opsowl_test
          POSTGRES_USER: opsowl
          POSTGRES_PASSWORD: opsowldev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://opsowl:opsowldev@localhost:5432/opsowl_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test ./... -cover -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage ≥ 90%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 90" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below 90%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets target"

  # ── Python AI Service ───────────────────────────────────────────────────────
  python-test:
    name: Python — pytest, coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # ── Docker build validation ──────────────────────────────────────────────────
  docker-build:
    name: Docker — validate builds
    runs-on: ubuntu-latest
    needs: [go-test, python-test, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Service image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-service
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
