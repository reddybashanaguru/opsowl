version: "2"
sql:
  - engine: "postgresql"
    queries: "db/dml/queries/"
    schema: "db/migrations/incremental/"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullTime"
          - db_type: "text"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullString"
          - db_type: "int4"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullInt32"
          - db_type: "numeric"
            nullable: true
            go_type:
              import: "database/sql"
              type: "NullFloat64"
